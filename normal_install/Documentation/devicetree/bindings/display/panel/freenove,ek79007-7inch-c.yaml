%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/freenove,ek79007-7inch-c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freenove 7-inch DSI panel with EK79007 controller

maintainers:
  - Zhentao-Lin <173039613@qq.com>

description: |
  The Freenove 7inch-C DSI panel uses an EK79007 glass with a resolution of
  1024x600, connected via a 2-lane MIPI DSI video-mode link.  Power/reset and
  backlight are controlled by an on-panel I2C MCU at address 0x45, which is
  handled by a separate driver (freenove,panel-mcu).

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: freenove,ek79007-7inch-c

  reg:
    description: DSI virtual channel number
    maxItems: 1

  reset-gpios:
    description: Reset line of the panel (active-high)
    maxItems: 1

  iovcc-gpios:
    description: IOVCC regulator line (active-high)
    maxItems: 1

  avdd-gpios:
    description: AVDD regulator line (active-high)
    maxItems: 1

  backlight:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the backlight device registered by the panel MCU

  rotation:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Panel rotation in degrees (0, 90, 180, 270)
    enum: [0, 90, 180, 270]

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: |
      Panel input port.  Must contain one endpoint connected to the DSI host
      output endpoint.

required:
  - compatible
  - reg
  - reset-gpios
  - iovcc-gpios
  - avdd-gpios
  - backlight
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi_panel: dsi_panel@0 {
        compatible = "freenove,ek79007-7inch-c";
        reg = <0>;
        reset-gpios = <&panel_mcu 1 GPIO_ACTIVE_HIGH>;
        iovcc-gpios = <&panel_mcu 4 GPIO_ACTIVE_HIGH>;
        avdd-gpios = <&panel_mcu 0 GPIO_ACTIVE_HIGH>;
        backlight = <&panel_mcu>;

        port {
            panel_in: endpoint {
                remote-endpoint = <&dsi_out>;
            };
        };
    };
